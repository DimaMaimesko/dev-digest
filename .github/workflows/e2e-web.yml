# Web end-to-end suite — the real stack + deterministic agent-browser flows.
#
# Boots exactly what scripts/dev.sh boots: Postgres (pgvector) in Docker, the
# Go API (api/) on :3001, migrated and seeded by api/cmd/db, and the Next.js
# app on :3000 built against that API. Then runs the e2e/ specs through the
# agent-browser CLI.
#
# No API keys: every key is optional, so the API boots and serves the seeded
# read-only data the specs exercise — no LLM is called.
#
# server/src/db/migrations/** is in the path filter because api/cmd/db applies
# the migrations from there; the rest of server/ no longer runs here.
name: e2e web

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'api/**'
      - 'server/src/db/migrations/**'
      - 'e2e/**'
      - '.github/workflows/e2e-web.yml'
  pull_request:
    paths:
      - 'client/**'
      - 'api/**'
      - 'server/src/db/migrations/**'
      - 'e2e/**'
      - '.github/workflows/e2e-web.yml'

permissions:
  contents: read

concurrency:
  group: e2e-web-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://devdigest:devdigest@localhost:5433/devdigest
  NEXT_PUBLIC_API_BASE: http://localhost:3001
  E2E_BASE_URL: http://localhost:3000

jobs:
  e2e:
    name: browser flows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      # --- Postgres (pgvector) via the repo's compose file ---
      - name: Start Postgres
        run: |
          docker compose up -d
          echo "waiting for Postgres health…"
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' devdigest-postgres 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && { echo "postgres healthy"; break; }
            sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' devdigest-postgres)" = "healthy" ]

      # --- API: build, migrate, seed, then start in the background ---
      # bin/db runs from api/, where it finds ../server/src/db/migrations. The
      # API reads DATABASE_URL from the job env and listens on :3001 by default.
      - name: Build + migrate + seed (api)
        working-directory: api
        run: |
          make build
          ./bin/db migrate
          ./bin/db seed

      - name: Start API (:3001)
        working-directory: api
        run: |
          nohup ./bin/api > "$RUNNER_TEMP/api.log" 2>&1 &
          echo "waiting for API /health…"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3001/health >/dev/null 2>&1 && { echo "api up"; break; }
            sleep 2
          done
          curl -fsS http://localhost:3001/health || { echo "::error::API never became healthy"; cat "$RUNNER_TEMP/api.log"; exit 1; }

      # --- Web: build against the API, then serve in the background ---
      - name: Build + start web (:3000)
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          nohup pnpm start > "$RUNNER_TEMP/web.log" 2>&1 &
          echo "waiting for web :3000…"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000 >/dev/null 2>&1 && { echo "web up"; break; }
            sleep 2
          done
          curl -fsS http://localhost:3000 >/dev/null 2>&1 || { echo "::error::web never became reachable"; cat "$RUNNER_TEMP/web.log"; exit 1; }

      # --- agent-browser CLI (Rust + CDP) + Chrome for Testing ---
      - name: Install agent-browser
        run: |
          npm i -g agent-browser
          agent-browser install --with-deps

      - name: Run e2e flows
        working-directory: e2e
        run: |
          npm ci
          npm test

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            e2e/test-results/**
          if-no-files-found: ignore
